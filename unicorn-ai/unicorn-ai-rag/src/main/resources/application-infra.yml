# 使用 Unicorn 现有基础设施：
# - Redis Stack: 10.211.55.29:6379 / redis-psd（RAG 向量库 + Chat 对话记忆）
# - MySQL:      10.211.55.29:3306/unicorn / root:root（异步任务审计）
# - RabbitMQ:   10.211.55.29:5672 / admin:admin，vhost /unicorn（异步入库）
# - pgvector:   10.211.55.29:5434/vectordb / postgres:postgres（备选向量库）
#
# 用法：--spring.profiles.active=infra
# 注意：infra 启动时会连接上述服务；默认 profile 仍是零依赖 demo。
spring:
  config:
    activate:
      on-profile: infra
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${MQ_HOST:10.211.55.29}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:admin}
    password: ${MQ_PWD:admin}
    virtual-host: ${MQ_VHOST:/unicorn}
    listener:
      simple:
        default-requeue-rejected: false

management:
  health:
    db:
      enabled: true
    rabbit:
      enabled: true

demo:
  ai:
    rag:
      # Redis Stack 已加载 RediSearch；如果换回普通 Redis，请改成 pgvector 或 simple。
      vector-store: redis
      job-store: jdbc
      redis:
        host: ${REDIS_HOST:10.211.55.29}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:redis-psd}
        index-name: unicorn-ai-rag
        prefix: "unicorn-ai-rag:"
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
      # 备选：--demo.ai.rag.vector-store=pgvector
      pgvector:
        url: ${PGVECTOR_URL:jdbc:postgresql://10.211.55.29:5434/vectordb}
        username: ${PGVECTOR_USER:postgres}
        password: ${PGVECTOR_PWD:postgres}
        table-name: unicorn_ai_rag
        schema-name: public
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
      async-ingest:
        enabled: true
        exchange: unicorn.ai.rag
        queue: unicorn.ai.rag.ingest
        routing-key: ingest
