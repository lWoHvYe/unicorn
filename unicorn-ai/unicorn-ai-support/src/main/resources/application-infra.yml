# Production-like profile: PostgreSQL/pgvector + Redis + RabbitMQ.
# Usage: --spring.profiles.active=infra
spring:
  config:
    activate:
      on-profile: infra
  datasource:
    url: ${AI_DB_URL:jdbc:postgresql://10.211.55.29:5434/vectordb?currentSchema=ai_support,public}
    username: ${AI_DB_USER:postgres}
    password: ${AI_DB_PWD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/postgres
    schemas: ai_support
    default-schema: ai_support
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:10.211.55.29}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis-psd}
      database: ${AI_REDIS_DATABASE:7}
  rabbitmq:
    host: ${MQ_HOST:10.211.55.29}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:admin}
    password: ${MQ_PWD:admin}
    virtual-host: ${MQ_VHOST:/unicorn}
    listener:
      simple:
        default-requeue-rejected: false

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true

ai:
  security:
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      hmac-secret: ${JWT_HMAC_SECRET:}
      audience: ${JWT_AUDIENCE:}
  support:
    demo:
      seed: ${AI_DEMO_SEED:false}
      model: ${AI_DEMO_MODEL:false}
    vector-store: pgvector
    async-ingest:
      enabled: true
      exchange: unicorn.ai.support
      queue: unicorn.ai.support.ingest
      routing-key: ingest
    rls:
      enabled: ${AI_RLS_ENABLED:true}
      fail-fast: ${AI_RLS_FAIL_FAST:false}
    rate-limit:
      store: redis
    cache:
      store: redis
