name: ai-support

on:
  pull_request:
    paths:
      - 'unicorn-ai/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/ai-support.yml'
  push:
    branches: [main]
    paths:
      - 'unicorn-ai/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/ai-support.yml'

concurrency:
  group: ai-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Unit and integration tests
        run: ./gradlew :unicorn-ai-tools:test :unicorn-ai-support:test :unicorn-ai-mcp-client:test :unicorn-ai-mcp-server:test --no-daemon
      - name: Build
        run: ./gradlew :unicorn-ai-support:assemble :unicorn-ai-tools:assemble --no-daemon
      - name: Build container
        run: docker build -f unicorn-ai/unicorn-ai-support/Dockerfile -t unicorn-ai-support:ci .
